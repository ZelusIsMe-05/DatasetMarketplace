[alembic]
script_location = alembic
# URL thật được đặt lúc chạy (app/models/session.py: run_migrations); dòng dưới chỉ dùng khi tạo revision bằng tay
sqlalchemy.url = sqlite:///../storage/alembic-dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giongque-backend"
version = "0.1.0"
description = "Dataset Marketplace – Vietnamese Voice Dataset Marketplace on Avalanche (backend, QC, relayer, CLI)"
requires-python = ">=3.11"

[project.scripts]
giongque = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.setuptools.package-data]
"app.blockchain" = ["abi/*.json"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: cần anvil + contract đã build (tự khởi chạy anvil)",
    "qc: chạy model wav2vec2 + Silero VAD thật (tải model lần đầu)",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# SeedDemo.s.sol đọc bộ câu mẫu + điều khoản thật để tính promptSetHash / termsHash
fs_permissions = [{ access = "read", path = "../seed" }, { access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
local = "http://127.0.0.1:8386"  # Anvil của dự án (8545 chừa cho dự án Hardhat khác)
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
mainnet = "https://api.avax.network/ext/bc/C/rpc"

[lint]
lint_on_build = false
